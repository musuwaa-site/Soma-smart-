<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Contours: hill, valley and a sampled profile</title><desc id="d">A schematic hill has nested 100, 120 and 140 metre contours. A valley's contour bends point upstream towards the north. A profile plots distances zero to four hundred metres at heights one hundred, one hundred twenty, one hundred sixty, one hundred eighty and one hundred eighty metres.</desc><rect width="900" height="520" fill="#f7faf4"/><g font-family="sans-serif" fill="#193b31"><text x="30" y="36" font-size="24">Reading relief — schematic teaching map</text><text x="40" y="76" font-size="18">Hill: heights increase inward</text><text x="460" y="76" font-size="18">Valley: V bends point upstream</text></g><g fill="none" stroke="#8e653d" stroke-width="3"><ellipse cx="200" cy="196" rx="160" ry="95"/><ellipse cx="200" cy="196" rx="112" ry="65"/><ellipse cx="200" cy="196" rx="57" ry="34"/><path d="M460 255 L580 210 L650 150 L720 210 L850 255 M460 205 L580 160 L650 100 L720 160 L850 205 M460 155 L580 110 L650 50 L720 110 L850 155"/></g><g font-family="sans-serif" font-size="17" fill="#614220"><text x="45" y="202">100 m</text><text x="98" y="202">120 m</text><text x="175" y="200">140 m</text><text x="790" y="250">100 m</text><text x="790" y="200">120 m</text><text x="790" y="150">140 m</text></g><path d="M650 82V270l-8-12m8 12 8-12" stroke="#187fb2" stroke-width="4" fill="none"/><g font-family="sans-serif" fill="#193b31"><text x="670" y="285">Water flows towards lower ground</text><text x="40" y="331" font-size="18">Profile data: distance (m) 0 | 100 | 200 | 300 | 400</text><text x="40" y="355" font-size="18">Height (m) 100 | 120 | 160 | 180 | 180</text><text x="40" y="398">Contour interval: 20 m. Scale of sketch is illustrative.</text><text x="40" y="425">Close contours indicate steeper ground; labels establish the direction of rise.</text><text x="40" y="458">A profile needs labelled horizontal and vertical scales.</text><text x="40" y="489">N ↑   Key: brown = contour; blue = stream</text></g></svg>
