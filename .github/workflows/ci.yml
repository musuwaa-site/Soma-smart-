name: Engineering checks (development edition)
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: npm run build
      - run: node scripts/verify_release.mjs
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: somasmart-unfinished-development-build
          path: artifacts/
