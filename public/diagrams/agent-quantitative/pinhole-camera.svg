<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Pinhole camera ray paths</title><desc id="desc">A vertical object left of a pinhole forms an inverted image on a screen to the right. Rays cross at the pinhole. Distances are schematic.</desc><rect width="760" height="330" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="18" fill="#17334a"><text x="28" y="30">Pinhole camera: real, inverted image</text><text x="67" y="292">Object</text><text x="338" y="292">Pinhole</text><text x="616" y="292">Screen</text><text x="170" y="318">object distance u</text><text x="458" y="318">image distance v</text></g><path d="M95 240V75M87 89L95 75L103 89" stroke="#087f8c" stroke-width="6" fill="none"/><path d="M365 45V155M365 175V265" stroke="#17334a" stroke-width="9"/><path d="M650 45V265" stroke="#17334a" stroke-width="6"/><path d="M650 260V86M642 244L650 260L658 244" stroke="#ce4266" stroke-width="5" fill="none"/><path d="M95 75L365 165L650 260M95 240L365 165L650 86" stroke="#d28415" stroke-width="2" fill="none"/><path d="M55 165H690" stroke="#64748b" stroke-dasharray="7 5"/><g font-family="Arial,sans-serif" font-size="14" fill="#475569"><text x="423" y="66">Rays cross at the hole</text><text x="442" y="90">Not drawn to scale</text></g></svg>
