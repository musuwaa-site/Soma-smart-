<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="t d"><title id="t">Water transfers linking Earth systems</title><desc id="d">Atmospheric moisture supplies rain to surface and soil water. Roots take up soil water into plants. Plants return vapour through transpiration and surface water returns vapour through evaporation. The schematic shows stores as boxes and transfers as labelled arrows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#287c9b"/></marker></defs><rect width="900" height="530" fill="#f7faf4"/><g font-family="sans-serif" fill="#193b31"><text x="30" y="40" font-size="25">Earth systems exchange water</text><text x="30" y="72" font-size="17">Boxes are stores; arrows are processes. This is a simplified model.</text></g><g stroke="#426d58" stroke-width="2" fill="#deeee2"><rect x="300" y="105" width="290" height="75" rx="12"/><rect x="50" y="330" width="250" height="80" rx="12"/><rect x="590" y="330" width="250" height="80" rx="12"/></g><g font-family="sans-serif" font-size="21" fill="#193b31" text-anchor="middle"><text x="445" y="137">Atmospheric moisture</text><text x="445" y="162" font-size="16">Water vapour / clouds</text><text x="175" y="365">Surface and soil water</text><text x="175" y="391" font-size="16">Hydrosphere in soil/land</text><text x="715" y="365">Water in plants</text><text x="715" y="391" font-size="16">Biosphere</text></g><g fill="none" stroke="#287c9b" stroke-width="4" marker-end="url(#arrow)"><path d="M330 180L195 320"/><path d="M300 370H575"/><path d="M650 320L530 190"/><path d="M95 322Q75 180 285 140"/></g><g font-family="sans-serif" font-size="18" fill="#193b31"><text x="230" y="258">Rain / infiltration</text><text x="350" y="352">Root uptake</text><text x="625" y="248">Transpiration</text><text x="55" y="195">Evaporation</text><text x="35" y="460">Soil combines minerals, water, air and life: system boundaries overlap.</text><text x="35" y="493">Flow sizes vary with rainfall, temperature, soil, vegetation and land use.</text></g></svg>
